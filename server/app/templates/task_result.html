{% extends 'base.html' %}{% block content %}
<div class="page-header">
  <a href="/swarms/{{ swarm_id }}" style="font-size:.85rem;color:#526575;">&larr; Back to Swarm</a>
  <h1 style="margin-top:8px;">{{ title }}</h1>
  {% if description %}<p style="color:#526575;">{{ description }}</p>{% endif %}
</div>

<div style="display:grid;gap:20px;">
  {% for r in results %}
  <div style="background:white;border:1px solid var(--line);padding:24px;border-top:3px solid {{ dept_colors.get(r.department,'#c8fc55') if dept_colors is defined else '#c8fc55' }};">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
      <div style="width:40px;height:40px;background:#f0f4f7;display:flex;align-items:center;justify-content:center;font-weight:700;">
        {{ r.agent[0] }}
      </div>
      <div>
        <strong style="display:block;">{{ r.agent }}</strong>
        <span style="font-size:.8rem;color:#526575;">{{ r.role }} &middot; {{ r.department }}</span>
      </div>
    </div>
    <p style="margin:0;line-height:1.7;white-space:pre-wrap;">{{ r.response }}</p>
  </div>
  {% endfor %}
</div>
{% endblock %}
