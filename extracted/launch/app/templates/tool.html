{% extends 'base.html' %}{% block content %}<h1>{{ title }}</h1><p class="notice">{{ description }}</p><form action="/tools/{{ module }}" method="post" enctype="multipart/form-data"><div class="fields">{% for f in fields %}<label for="{{ module }}-{{ f.name }}">{{ f.title }}{% if f.options %}<select id="{{ module }}-{{ f.name }}" name="{{ f.name }}" aria-label="{{ f.title }}">{% for v in f.options %}<option value="{{ v }}" {% if v==f.default %}selected{% endif %}>{{ v }}</option>{% endfor %}</select>{% elif f.long %}<textarea id="{{ module }}-{{ f.name }}" name="{{ f.name }}" aria-label="{{ f.title }}" rows="5" {% if f.required and module!='formatter' %}required{% endif %}></textarea>{% else %}<input id="{{ module }}-{{ f.name }}" name="{{ f.name }}" aria-label="{{ f.title }}" type="{{ 'number' if f.type=='integer' else 'date' if f.format=='date' else 'text' }}" value="{{ f.default if f.default is not none else '' }}" {% if f.required %}required{% endif %}{% if f.min is not none %} min="{{ f.min }}"{% endif %}{% if f.max is not none %} max="{{ f.max }}"{% endif %}>{% endif %}</label>{% endfor %}{% if module=='formatter' %}<label>Or upload a file<input type="file" id="payload-upload" name="file" aria-label="Payload file" accept=".pdf,.txt,.json,.html,.md"></label>{% endif %}{% if module=='availability' %}<label>API key<input type="password" name="api_key" aria-label="API key" autocomplete="off" required></label>{% endif %}</div><button>Submit</button></form>{% if result %}<h2>Result</h2><pre id="tool-result">{{ result|tojson(indent=2) }}</pre>{% endif %}{% endblock %}
