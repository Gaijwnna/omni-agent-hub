# Place inside the HTTPS server for your configured PUBLIC_URL.
# Terminate TLS with your normal certificate manager. Do not expose port 8000.
client_max_body_size 7m;
client_body_buffer_size 8m;
client_body_timeout 20s;
location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto https;
    # Uvicorn deliberately does not trust forwarded IPs by default. Configure a
    # known proxy allowlist before enabling real-client-IP rate limits.
    proxy_buffering off;
    proxy_read_timeout 70s;
    access_log off;
}
